name: gitartwork from a contribution graph
on:
  push:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  build:
    name: Make gitartwork SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: jasineri/gitartwork@v1
        with:
           user_name: iamdpsingh
           text: D P Singh
      - name: Recolor gitartwork to orange theme
        run: |
          sed -i 's/rgba(27, 31, 35, 0.06)/#1a1b26/g' gitartwork.svg
          sed -i 's/#9be9a8/#7c2d12/g' gitartwork.svg
          sed -i 's/#40c463/#c2410c/g' gitartwork.svg
          sed -i 's/#30a14e/#ea580c/g' gitartwork.svg
          sed -i 's/#216e39/#f97316/g' gitartwork.svg
      - name: Add single dot periods
        run: |
          python3 -c '
          svg = open("gitartwork.svg").read()
          for col in [176, 368]:
              idx = svg.find(f"<g transform=\"translate({col}, 0)\">")
              if idx != -1:
                  end_idx = svg.find("</g>", idx)
                  block = svg[idx:end_idx]
                  block = block.replace("y=\"90\" data-level=\"0\" rx=\"2\" ry=\"2\" class=\"o\"", "y=\"90\" data-level=\"0\" rx=\"2\" ry=\"2\" class=\"o\" style=\"fill: var(--c4); stroke: var(--c4);\"")
                  svg = svg[:idx] + block + svg[end_idx:]
          open("gitartwork.svg", "w").write(svg)
          '
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update gitartwork
