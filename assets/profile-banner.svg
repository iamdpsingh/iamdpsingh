<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">From signal to system</title>
  <desc id="desc">A charcoal, orange, and red data engineering schematic: ingest, transform, serve.</desc>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ef4444"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="960" height="280" rx="16" fill="#050505"/>
  <rect width="960" height="280" rx="16" fill="url(#grid)"/>
  <path d="M40 39H72" stroke="url(#heat)" stroke-width="3"/>
  <text x="84" y="44" fill="#b7b7bf" font-family="monospace" font-size="12" letter-spacing="2">DPS / ENGINEERING NOTEBOOK</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">
    <text x="40" y="119" fill="#ffffff">FROM SIGNAL</text>
    <text x="40" y="179" fill="url(#heat)">TO SYSTEM.</text>
  </g>
  <text x="42" y="234" fill="#b7b7bf" font-family="monospace" font-size="13">DATA PIPELINES / CLOUD SYSTEMS / USEFUL PRODUCTS</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M611 95H647L682 139H738L773 95H885M611 185H647L682 141M738 141L773 185H885" stroke="#393939" stroke-width="2"/>
    <path d="M611 95H647L682 139H738L773 185H885" stroke="url(#heat)" stroke-width="3"/>
    <rect x="678" y="112" width="66" height="56" rx="10" fill="#14100e" stroke="#f97316"/>
    <path d="M695 133L705 141L695 149M716 149H728" stroke="#f97316" stroke-width="2"/>
    <g fill="#050505" stroke="#ef4444" stroke-width="2">
      <circle cx="611" cy="95" r="6"/><circle cx="611" cy="185" r="6"/>
    </g>
    <g fill="#f97316" stroke="#f97316"><circle cx="885" cy="95" r="5"/><circle cx="885" cy="185" r="5"/></g>
  </g>
  <g fill="#b7b7bf" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1">
    <text x="611" y="226">INGEST</text><text x="711" y="226">TRANSFORM</text><text x="869" y="226">SERVE</text>
  </g>
  <path d="M40 265H920" stroke="#252525"/>
  <path d="M40 265H204" stroke="url(#heat)" stroke-width="2"/>
